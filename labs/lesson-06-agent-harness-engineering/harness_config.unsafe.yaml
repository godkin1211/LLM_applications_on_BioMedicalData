agent:
  tools:
    - browser
    - terminal
    - file_write
    - pubmed_search
  read_paths:
    - ./
  write_paths:
    - ./
  network: true
  memory:
    enabled: true
    store_phi: true
  logging:
    enabled: false
  verification:
    require_citation_for_claims: false
    run_csv_validation: false
  human_review_required_if:
    - low_confidence

